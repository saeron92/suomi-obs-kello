<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

/* Helvetica Neue Bold */
@font-face {
  font-family: "Helvetica Neue Custom";
  src: url("./HelveticaNeue-Bold.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Helvetica Neue Custom", sans-serif;
  font-weight: 700;
  color: white;
}

.clock {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  white-space: nowrap;
  line-height: 1;
  font-size: 48px;
  font-weight: 700;
  letter-spacing: 1.5px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
}

</style>
</head>

<body>

<div class="clock">
  <div id="date"></div>
  <div id="time"></div>
</div>

<script>

const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");

const weekdays = {
  Monday: "MA",
  Tuesday: "TI",
  Wednesday: "KE",
  Thursday: "TO",
  Friday: "PE",
  Saturday: "LA",
  Sunday: "SU"
};

function updateClock() {

  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Helsinki",
    weekday: "long",
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date());

  const p = {};

  for (const part of parts) {
    p[part.type] = part.value;
  }

  dateEl.textContent =
    `${weekdays[p.weekday]} ${p.day}.${p.month}.${p.year}`;

  timeEl.textContent =
    `${p.hour}:${p.minute}`;
}

updateClock();

setInterval(updateClock, 1000);

</script>

</body>
</html>
